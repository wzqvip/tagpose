name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: |
          python -m pip install --upgrade pip
          # headless build: no GUI backend, no libGL, and the tests never open a window
          pip install numpy pytest opencv-python-headless
          pip install -e . --no-deps

      - name: tests
        run: python -m pytest

      - name: end-to-end selftest
        run: python -m tagpose selftest

      - name: board generation smoke test
        run: |
          python -m tagpose board --paper a4 --out /tmp/board
          test -s /tmp/board.svg
          test -s /tmp/board.json
          python -c "import tagpose, json; print(tagpose.__version__); json.load(open('/tmp/board.json'))"
