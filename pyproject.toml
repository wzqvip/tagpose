[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagpose"
version = "0.1.0"
description = "AprilTag 6-DoF camera pose: measure a viewpoint, save it, and guide back to it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Taco", email = "wangziqi2002vip@163.com" }]
keywords = ["apriltag", "aruco", "camera-calibration", "pose-estimation", "sim2real", "robotics"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/wzqvip/tagpose"
Issues = "https://github.com/wzqvip/tagpose/issues"

[project.scripts]
tagpose = "tagpose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
